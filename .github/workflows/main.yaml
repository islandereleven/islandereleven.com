name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  TF_VERSION: '1.8.5'
  AWS_REGION: 'eu-central-1'
  POETRY_VERSION: '2.2.1'

jobs:
  job-checks:
    name: Job Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"

      - name: Check jobs
        run: |
          set -euo pipefail

          mapfile -t job_dirs < <(find jobs -mindepth 1 -maxdepth 1 -type d | sort)

          if [ "${#job_dirs[@]}" -eq 0 ]; then
            echo "No jobs found."
            exit 0
          fi

          for job_dir in "${job_dirs[@]}"; do
            echo "::group::${job_dir}"
            pushd "${job_dir}"

            if [ -f pyproject.toml ]; then
              poetry install --with test
              poetry check
              poetry run pytest tests/unit/ -v

              if [ -f Makefile ] && grep -q '^build-job:' Makefile; then
                make build-job
              elif [ -f Dockerfile ]; then
                docker build --platform=linux/arm64 -t "job-check-$(basename "${job_dir}")" . --no-cache
              fi
            elif [ -f Makefile ] && grep -q '^test-unit:' Makefile; then
              make test-unit
            else
              echo "No supported check target found for ${job_dir}."
            fi

            popd
            echo "::endgroup::"
          done

  terraform-format:
    name: Terraform Stack Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Stack Format Check
        run: terraform fmt -check -recursive infrastructure/stacks

  setup-terraform-matrix:
    name: Setup Terraform Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: set-matrix
        name: Find Terraform Directories
        run: |
          TF_DIRS=$(find infrastructure -mindepth 1 -type f -name '*.tf' -exec dirname {} \; | sort -u | grep -vE '(\.terraform|/module)$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=${TF_DIRS}" >> "${GITHUB_OUTPUT}"

  terraform:
    name: Terraform Plan / Main Apply (${{ matrix.tf_dir }})
    needs:
      - terraform-format
      - setup-terraform-matrix
    runs-on: ubuntu-latest
    environment: aws

    strategy:
      fail-fast: false
      matrix:
        tf_dir: ${{ fromJSON(needs.setup-terraform-matrix.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.tf_dir }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Generate sanitized artifact name
        run: |
          echo "ARTIFACT_NAME=tfplan-$(echo '${{ matrix.tf_dir }}' | sed 's/\//-/g')" >> "${GITHUB_ENV}"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ matrix.tf_dir }}/tfplan

      - name: Terraform Apply (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

  deploy-time-in-zone-chart-prod:
    name: Deploy Time In Zone Chart Prod
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - job-checks
      - terraform
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: package
        name: Detect package
        run: |
          if [ -f jobs/time_in_zones_chart_generator/Makefile ] && grep -q '^push-job:' jobs/time_in_zones_chart_generator/Makefile; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "time_in_zones_chart_generator package is not present yet; skipping prod image deploy."
          fi

      - name: Setup Python
        if: steps.package.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup QEMU
        if: steps.package.outputs.present == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Poetry
        if: steps.package.outputs.present == 'true'
        run: python -m pip install "poetry==${POETRY_VERSION}"

      - name: Configure AWS credentials
        if: steps.package.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: aws-account
        name: Read AWS account id
        if: steps.package.outputs.present == 'true'
        run: |
          echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "${GITHUB_OUTPUT}"

      - name: Build and push prod image
        if: steps.package.outputs.present == 'true'
        working-directory: jobs/time_in_zones_chart_generator
        run: AWS_ACCOUNT_ID="${{ steps.aws-account.outputs.id }}" make push-job

      - name: Update prod Lambda image
        if: steps.package.outputs.present == 'true'
        run: |
          IMAGE_URI="${{ steps.aws-account.outputs.id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/time-in-zone-chart:latest"

          aws lambda update-function-code \
            --function-name time_in_zone_chart_lambda_function \
            --image-uri "${IMAGE_URI}" \
            --region "${AWS_REGION}"

          aws lambda wait function-updated \
            --function-name time_in_zone_chart_lambda_function \
            --region "${AWS_REGION}"

      - name: Print resolved prod image
        if: steps.package.outputs.present == 'true'
        run: |
          aws lambda get-function \
            --function-name time_in_zone_chart_lambda_function \
            --region "${AWS_REGION}" \
            --query 'Code.ResolvedImageUri'
